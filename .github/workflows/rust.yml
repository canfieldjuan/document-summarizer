name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build frontend assets
        run: |
          npm ci
          npm run build
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Test all targets and features
        working-directory: src-tauri
        run: cargo test --locked --all-targets --all-features
      - name: Deny clippy warnings
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  windows-connect:
    name: Windows Connect security
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      LOCAL_CONNECT_ENTITLEMENT_KEYRING_FILE: ${{ github.workspace }}\connect-contracts\entitlements\v1\release\keyring.json
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_REVISION }}
      - name: Check out Connect contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: canfieldjuan/connect-contracts
          ref: 3005d82a7be885fba36f8688b5967a5b56a0abea
          path: connect-contracts
          persist-credentials: false
      - name: Verify source revision
        shell: pwsh
        run: |
          $actualRevision = (git rev-parse HEAD).Trim()
          if ($actualRevision -ne $env:SOURCE_REVISION) {
            throw "Expected source revision $env:SOURCE_REVISION, found $actualRevision"
          }
          Set-Content -LiteralPath windows-source-revision.txt -Value $actualRevision -NoNewline
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build frontend assets
        shell: pwsh
        run: |
          npm ci
          npm run build
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Run native Windows Connect tests
        working-directory: src-tauri
        run: 'cargo test --locked --lib connect::'
      - name: Deny native Windows warnings
        working-directory: src-tauri
        run: 'cargo clippy --locked --lib --tests -- -D warnings'
      - name: Probe Windows installer inventory boundaries
        shell: pwsh
        run: |
          $probeRoot = Join-Path $PWD ".bundle-manifest-probe"
          $emptyRoot = Join-Path $probeRoot "empty"
          $validRoot = Join-Path $probeRoot "valid"
          New-Item -ItemType Directory -Path $emptyRoot, (Join-Path $validRoot "nested") -Force | Out-Null

          $emptyRejected = $false
          try {
            ./scripts/windows-bundle-manifest.ps1 `
              -BundleRoot $emptyRoot `
              -OutputPath (Join-Path $probeRoot "empty.json")
          } catch {
            $emptyRejected = $_.Exception.Message -like "No Windows installer was produced under *"
          }
          if (-not $emptyRejected) {
            throw "The empty installer boundary was not rejected"
          }

          Set-Content -LiteralPath (Join-Path $validRoot "Document Summarizer.msi") -Value "msi-probe" -NoNewline
          $singleManifest = Join-Path $probeRoot "single.json"
          ./scripts/windows-bundle-manifest.ps1 `
            -BundleRoot $validRoot `
            -OutputPath $singleManifest
          $singleEntries = @(Get-Content -LiteralPath $singleManifest -Raw | ConvertFrom-Json)
          if ($singleEntries.Count -ne 1 -or $singleEntries[0].path -notlike "*.msi") {
            throw "The single-installer boundary was not preserved as a one-entry array"
          }

          Set-Content -LiteralPath (Join-Path $validRoot "nested\Document Summarizer.EXE") -Value "exe-probe" -NoNewline
          Set-Content -LiteralPath (Join-Path $validRoot "ignore.txt") -Value "ignore-probe" -NoNewline
          $validManifest = Join-Path $probeRoot "valid.json"
          ./scripts/windows-bundle-manifest.ps1 `
            -BundleRoot $validRoot `
            -OutputPath $validManifest

          $entries = @(Get-Content -LiteralPath $validManifest -Raw | ConvertFrom-Json)
          if ($entries.Count -ne 2) {
            throw "Expected exactly two installer entries, found $($entries.Count)"
          }
          $actualPaths = @($entries.path)
          $sortedPaths = @($actualPaths | Sort-Object)
          for ($index = 0; $index -lt $actualPaths.Count; $index++) {
            if ($actualPaths[$index] -cne $sortedPaths[$index]) {
              throw "Installer entries are not in stable path order"
            }
          }
          if (@($actualPaths | Where-Object { $_ -like "*.txt" }).Count -ne 0) {
            throw "A non-installer file entered the manifest"
          }
          foreach ($entry in $entries) {
            $file = Join-Path $PWD $entry.path
            if ($entry.length_bytes -ne (Get-Item -LiteralPath $file).Length) {
              throw "Length mismatch for $($entry.path)"
            }
            $expectedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            if ($entry.sha256 -ne $expectedHash) {
              throw "SHA-256 mismatch for $($entry.path)"
            }
          }
      - name: Build Windows installers
        shell: pwsh
        run: npm run desktop:build
      - name: Record Windows installer inventory
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "src-tauri\target\release\bundle"
          ./scripts/windows-bundle-manifest.ps1 `
            -BundleRoot $bundleRoot `
            -OutputPath windows-bundle-manifest.json
          Get-Content windows-bundle-manifest.json
      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: document-summarizer-windows-${{ env.SOURCE_REVISION }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            windows-bundle-manifest.json
            windows-source-revision.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
