<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
      <h1>Document Summarizer</h1>
      <p>Select a PDF to ingest.</p>
      
      <button id="select-btn" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">Select PDF File</button>

      <div id="status" style="margin-top: 20px; text-align: left; max-width: 600px; word-wrap: break-word; background: #f0f0f0; padding: 15px; border-radius: 8px; display: none;">
        <h3>Ingestion Result</h3>
        <pre id="result-json" style="white-space: pre-wrap; font-size: 12px;"></pre>
      </div>
      
      <div id="error" style="margin-top: 20px; color: red; display: none;"></div>
    </main>
  </body>
</html>
