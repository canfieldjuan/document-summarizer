[package]
name = "document-summarizer"
version = "0.1.0"
description = "Local, evidence-grounded summaries for native-text PDF documents"
authors = ["Juan Canfield"]
edition = "2021"
default-run = "document-summarizer"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "document_summarizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "document-summarizer"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
thiserror = "1.0"
sha2 = "0.10.8"
tauri-plugin-dialog = "2"
pdf-extract = "0.12.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync"] }
subtle = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
